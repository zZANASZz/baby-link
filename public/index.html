<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- theme-color/description/favicon : verifie empiriquement (export reel) qu'Expo continue
         de les injecter lui-meme depuis app.json en fin de <head>, meme avec ce public/index.html
         personnalise -> pas besoin de les dupliquer ici. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Baby-link" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Baby-link</title>
   <style>
  html, body { height: 100%; margin: 0; padding: 0; }
  body { overflow: hidden; }
  /* FIX SCROLL ANDROID (racine du bug, confirmé sur device réel) : #root ne
     doit PAS dépendre d'une cascade height:100%/100dvh à travers la chaîne de
     flex (html -> body -> #root -> ... -> ScrollView). Sur Samsung Internet
     et Chrome Android réels, cette cascade peut échouer à transmettre une
     hauteur bornée concrète (un des maillons se met à faire la taille de son
     contenu au lieu d'être borné), et TOUT ce qui est en dessous grandit avec
     lui : les ScrollView ne débordent plus jamais de leur conteneur et ne
     scrollent donc pas (scrollHeight == clientHeight).
     La preuve que ce mécanisme marche : les <Modal> de react-native-web
     scrollent parfaitement sur ce même device, et leur implémentation
     (node_modules/react-native-web/dist/exports/Modal/ModalContent.js) pose
     position:fixed; top:0; right:0; bottom:0; left:0 sur leur conteneur —
     un ancrage direct au vrai viewport du navigateur, qui court-circuite
     complètement la cascade de hauteur des ancêtres. On applique exactement
     le même ancrage à #root : une fois #root réellement borné au viewport,
     tout ce qui est en dessous (StaffTabs/ParentTabs, content, tab-scroll)
     est un flex:1 ordinaire dans une chaîne enfin bornée, et se comporte
     comme prévu — plus besoin de 100dvh ni de @supports ici. */
  #root {
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    touch-action: pan-y;
  }
  input, textarea, select { font-size: 16px !important; touch-action: manipulation; }
</style>
  <!-- FIX SCROLL ANDROID (Chrome + Samsung Internet) : diagnostic sur device
       réel a montré que même une fois #root borné au viewport, #tab-content
       (petit-fils de #root via StaffTabs.js/ParentTabs.js) restait en
       position:relative -> il dépend encore de la cascade flex (flex:1 dans
       un flex column) qui échoue sur cet Android/Blink et grandit à la
       taille de son contenu (911px mesuré au lieu des 784px de l'écran) au
       lieu de rester borné -> #tab-scroll (absolute sur ce parent non borné)
       suit et scrollHeight == clientHeight -> rien ne scrolle.
       Remède : même ancrage direct qu'à #root, un niveau plus bas. #tabs-root
       (le View racine de StaffTabs/ParentTabs, cf. nativeID ajouté dans ces
       fichiers) est ancré en position:absolute inset:0 sur #root (déjà
       borné, CSS "absolute" remonte au premier ancêtre positionné même à
       travers des wrappers position:static intermédiaires) -> #tabs-root est
       donc borné à coup sûr, indépendamment de la cascade flex. La barre de
       nav (#tabs-navbar) reste dans le flux normal (hauteur naturelle)
       au-dessus de #tab-content. #tab-content est ancré en position:absolute
       sous la nav bar : sa hauteur ne dépend plus de flex:1, seulement du
       "top" = hauteur de la nav bar. Cette hauteur varie selon
       l'appareil/la taille de police (accessibilité), donc plutôt que de la
       coder en dur, un script mesure #tabs-navbar au runtime (ResizeObserver
       + MutationObserver pour attendre le montage React) et l'expose via la
       variable CSS --tabs-navbar-height. #tab-scroll reste ancré en
       absolute/inset:0 sur #tab-content, désormais réellement borné -> le
       scroll natif (déjà prouvé fonctionnel via les <Modal> react-native-web
       en position:fixed sur ce même device) s'active enfin. -->
  <style id="scroll-fix">
    #tabs-root {
      position: absolute !important;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      display: flex !important;
      flex-direction: column !important;
    }
    #tab-content {
      position: absolute !important;
      top: var(--tabs-navbar-height, 0px) !important;
      right: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      overflow: hidden !important;
    }
    #tab-scroll {
      position: absolute !important;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch !important;
    }
    /* Écrans avec un header fixe (bouton "+ Ajouter"...) au-dessus de leur
       ScrollView : #tab-scroll ne peut pas s'appliquer à la ScrollView elle-
       même dans ce cas (son ancêtre positionné le plus proche serait alors le
       View conteneur de l'écran, pas #tab-content -> le inset:0 recouvrirait
       le header au lieu de se limiter à la zone sous celui-ci). #tab-body
       reprend exactement le même ancrage borné que #tab-content, mais un
       niveau plus bas : sur le View conteneur de l'écran (header + contenu).
       Une fois ce conteneur borné, le header (flux normal) et la ScrollView
       (flex:1 ordinaire, plus besoin d'absolute) se comportent normalement. */
    #tab-body {
      position: absolute !important;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      overflow: hidden !important;
    }
  </style>
  <script id="scroll-fix-navbar-height">
    (function () {
      function applyHeight(navbar) {
        document.documentElement.style.setProperty(
          '--tabs-navbar-height',
          navbar.offsetHeight + 'px'
        );
      }
      var ro = null;
      function tryObserve() {
        var navbar = document.getElementById('tabs-navbar');
        if (!navbar) return false;
        applyHeight(navbar);
        if (window.ResizeObserver) {
          if (ro) ro.disconnect();
          ro = new ResizeObserver(function () { applyHeight(navbar); });
          ro.observe(navbar);
        }
        return true;
      }
      if (!tryObserve()) {
        var mo = new MutationObserver(function () {
          if (tryObserve()) mo.disconnect();
        });
        mo.observe(document.documentElement, { childList: true, subtree: true });
      }
      window.addEventListener('resize', function () {
        var navbar = document.getElementById('tabs-navbar');
        if (navbar) applyHeight(navbar);
      });
      window.addEventListener('orientationchange', function () {
        var navbar = document.getElementById('tabs-navbar');
        if (navbar) applyHeight(navbar);
      });
    })();
  </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
