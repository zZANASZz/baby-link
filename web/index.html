<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#5b8fcf" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Baby-link" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Baby-link</title>
   <style>
  html, body { height: 100%; margin: 0; padding: 0; }
  body { overflow: hidden; }
  /* FIX SCROLL ANDROID (racine du bug, confirmé sur device réel) : #root ne
     doit PAS dépendre d'une cascade height:100%/100dvh à travers la chaîne de
     flex (html -> body -> #root -> ... -> ScrollView). Sur Samsung Internet
     et Chrome Android réels, cette cascade peut échouer à transmettre une
     hauteur bornée concrète (un des maillons se met à faire la taille de son
     contenu au lieu d'être borné), et TOUT ce qui est en dessous grandit avec
     lui : les ScrollView ne débordent plus jamais de leur conteneur et ne
     scrollent donc pas (scrollHeight == clientHeight).
     La preuve que ce mécanisme marche : les <Modal> de react-native-web
     scrollent parfaitement sur ce même device, et leur implémentation
     (node_modules/react-native-web/dist/exports/Modal/ModalContent.js) pose
     position:fixed; top:0; right:0; bottom:0; left:0 sur leur conteneur —
     un ancrage direct au vrai viewport du navigateur, qui court-circuite
     complètement la cascade de hauteur des ancêtres. On applique exactement
     le même ancrage à #root : une fois #root réellement borné au viewport,
     tout ce qui est en dessous (StaffTabs/ParentTabs, content, tab-scroll)
     est un flex:1 ordinaire dans une chaîne enfin bornée, et se comporte
     comme prévu — plus besoin de 100dvh ni de @supports ici. */
  #root {
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    touch-action: pan-y;
  }
  input, textarea, select { font-size: 16px !important; }
</style>
  <!-- FIX SCROLL ANDROID (Chrome + Samsung Internet) : le style overflowY:'auto'
       posé côté React (StyleSheet.create) sur le ScrollView ne se propage pas
       toujours de façon fiable au DOM via le CSS atomique de react-native-web,
       en particulier sur Samsung Internet (Chromium plus ancien). On force donc
       la règle en CSS brut, ciblée par id (nativeID -> id sur web), avec
       !important pour battre n'importe quel ordre d'insertion des classes
       atomiques. id partagé "tab-scroll" : un seul écran d'onglet est monté à
       la fois (StaffTabs/ParentTabs ne rendent que l'onglet actif), donc pas
       de collision d'id.
       IMPORTANT : flex-basis doit être 0, pas auto. flex-basis:auto (la valeur
       par défaut du ScrollView de react-native-web quand seuls flexGrow/
       flexShrink sont posés) laisse la boîte grandir à la taille de son
       contenu au lieu d'être bornée par l'espace flex disponible, ce qui
       neutralise overflow-y:auto (scrollHeight == clientHeight, rien ne peut
       scroller). C'est la cause racine du bug diagnostiqué sur Settings. -->
  <style id="scroll-fix">
    #tab-scroll {
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch !important;
      flex: 1 1 0 !important;
      min-height: 0 !important;
    }
  </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
