<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#5b8fcf" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Baby-link" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Baby-link</title>
   <style>
  html, body { height: 100%; margin: 0; padding: 0; }
  body { overflow: hidden; }
  /* FIX SCROLL ANDROID (racine du bug, confirmé sur device réel) : #root ne
     doit PAS dépendre d'une cascade height:100%/100dvh à travers la chaîne de
     flex (html -> body -> #root -> ... -> ScrollView). Sur Samsung Internet
     et Chrome Android réels, cette cascade peut échouer à transmettre une
     hauteur bornée concrète (un des maillons se met à faire la taille de son
     contenu au lieu d'être borné), et TOUT ce qui est en dessous grandit avec
     lui : les ScrollView ne débordent plus jamais de leur conteneur et ne
     scrollent donc pas (scrollHeight == clientHeight).
     La preuve que ce mécanisme marche : les <Modal> de react-native-web
     scrollent parfaitement sur ce même device, et leur implémentation
     (node_modules/react-native-web/dist/exports/Modal/ModalContent.js) pose
     position:fixed; top:0; right:0; bottom:0; left:0 sur leur conteneur —
     un ancrage direct au vrai viewport du navigateur, qui court-circuite
     complètement la cascade de hauteur des ancêtres. On applique exactement
     le même ancrage à #root : une fois #root réellement borné au viewport,
     tout ce qui est en dessous (StaffTabs/ParentTabs, content, tab-scroll)
     est un flex:1 ordinaire dans une chaîne enfin bornée, et se comporte
     comme prévu — plus besoin de 100dvh ni de @supports ici. */
  #root {
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    touch-action: pan-y;
  }
  input, textarea, select { font-size: 16px !important; }
</style>
  <!-- FIX SCROLL ANDROID (Chrome + Samsung Internet) : diagnostic sur device
       réel (Chrome, écran Settings) a mesuré tous les ancêtres de #tab-scroll
       correctement bornés à la hauteur de l'écran (784px), MAIS #tab-scroll
       lui-même à 911px (la taille de son contenu) malgré flex:1 1 0 +
       min-height:0 -> scrollHeight == clientHeight -> rien à scroller. La
       résolution de hauteur en flex/% n'est donc pas fiable pour cet élément
       précis sur ce moteur. On applique le même remède que pour #root :
       ancrer #tab-scroll en position:absolute (inset:0) sur son parent direct
       #tab-content (qui, lui, est bien borné) -> #tab-scroll épouse alors
       exactement la boîte du parent quelle que soit la fiabilité de la
       cascade flex/%, comme les <Modal> react-native-web ancrées en
       position:fixed sur le viewport. -->
  <style id="scroll-fix">
    #tab-content {
      position: relative !important;
    }
    #tab-scroll {
      position: absolute !important;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch !important;
    }
  </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
