<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#5b8fcf" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Baby-link" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Baby-link</title>
   <style>
  html, body { height: 100%; margin: 0; padding: 0; }
  body { overflow: hidden; }
  #root { display: flex; flex-direction: column; height: 100%; flex: 1; touch-action: pan-y; }
  @supports (height: 100dvh) {
    html, body, #root { height: 100dvh; }
  }
  input, textarea, select { font-size: 16px !important; }
</style>
  <!-- FIX SCROLL ANDROID (Chrome + Samsung Internet) : le style overflowY:'auto'
       posé côté React (StyleSheet.create) sur le ScrollView ne se propage pas
       toujours de façon fiable au DOM via le CSS atomique de react-native-web,
       en particulier sur Samsung Internet (Chromium plus ancien). On force donc
       la règle en CSS brut, ciblée par id (nativeID -> id sur web), avec
       !important pour battre n'importe quel ordre d'insertion des classes
       atomiques. Écran de test : SettingsScreen (nativeID="settings-scroll"). -->
  <style id="scroll-fix">
    #settings-scroll {
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch !important;
      flex: 1 1 auto !important;
      min-height: 0 !important;
    }
  </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
